<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open the Box – Tens and Ones</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#e2f6ff,#fff0c9);color:#26345b;text-align:center}main{max-width:1050px;margin:auto;padding:22px}h1{font-size:clamp(2rem,5vw,4rem);color:#6536b4;margin:12px}p{font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:30px auto}.box{aspect-ratio:1;border:5px solid white;border-radius:24px;background:linear-gradient(145deg,#ffcb48,#f28b2b);box-shadow:0 8px #c36c1d;color:white;font-size:clamp(2rem,5vw,4rem);font-weight:900;cursor:pointer}.box:before{content:"🎁";display:block;font-size:1.5rem}.box.opened{background:linear-gradient(145deg,#65d7b3,#239d9a);box-shadow:0 8px #157c78}.box.opened:before{content:"✓"}.panel{max-width:760px;margin:35px auto;background:white;padding:35px 20px;border-radius:28px;box-shadow:0 12px 35px #394d7430}.question{font-size:clamp(1.7rem,4vw,2.8rem);font-weight:900;margin:30px 0}.answer{color:#087b53;font-size:2rem;font-weight:900;margin:20px}button.action{border:0;border-radius:16px;padding:15px 23px;margin:7px;background:#6744c4;color:white;font-size:1.1rem;font-weight:bold;cursor:pointer}.secondary{background:#e39a26!important;color:#292044!important}.hidden{display:none}.status{font-weight:bold}button:focus-visible{outline:4px solid #2563eb;outline-offset:3px}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}.panel{padding:22px 12px}}</style><main><h1>🎁 OPEN THE BOX! 🎁</h1><p>🌈 Tens and Ones Challenge 🌈</p><nav id="sets" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0"><button class="action" data-set="0">Boxes 1–5</button><button class="action" data-set="1">Boxes 6–10</button><button class="action" data-set="2">Boxes 11–15</button></nav><div id="home"><p class="status" id="status"></p><div class="grid" id="grid"></div><p>Choose a box, say your answer, then reveal it!</p></div><section id="panel" class="panel hidden" aria-live="polite"><h2 id="title"></h2><div id="question" class="question"></div><div id="answer" class="answer hidden"></div><button class="action" id="show">👀 Show answer</button><button class="action secondary" id="back">↩ Back to boxes</button></section><button class="action secondary" id="reset">🔄 Reset game</button></main><script>const questions=[["How many tens are in 21?","2 tens"],["How many ones are in 63?","3 ones"],["How many tens are in 42?","4 tens"],["How many ones are in 57?","7 ones"],["How many tens are in 63?","6 tens"],["How many ones are in 80?","0 ones"],["How many ones are in 70?","0 ones"],["What is the value of 5 in 51?","50"],["What is the value of 8 in 78?","8"],["What is the value of 9 in 96?","90"],["1 ten and 0 ones is: 10, 12 or 20?","10"],["8 tens and 5 ones is: 15, 85 or 58?","85"],["9 tens and 4 ones is: 49, 24 or 94?","94"],["7 tens and 2 ones is: 27, 72 or 17?","72"],["7 tens and 6 ones is: 16, 67 or 76?","76"]];const opened=new Set(),$=id=>document.getElementById(id);let activeSet=0;document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{activeSet=Number(b.dataset.set);render()});function render(){$("home").classList.remove("hidden");$("panel").classList.add("hidden");$("grid").replaceChildren();questions.forEach((q,i)=>{if(Math.floor(i/5)!==activeSet)return;const b=document.createElement("button");b.className="box"+(opened.has(i)?" opened":"");b.textContent=i+1;b.setAttribute("aria-label","Open box "+(i+1));b.onclick=()=>{opened.add(i);$("home").classList.add("hidden");$("panel").classList.remove("hidden");$("title").textContent="🎁 BOX "+(i+1);$("question").textContent=q[0];$("answer").textContent="✅ "+q[1];$("answer").classList.add("hidden");$("show").classList.remove("hidden")};$("grid").append(b)});$("status").textContent=[...opened].filter(i=>Math.floor(i/5)===activeSet).length+" of 5 boxes opened in this set"+(opened.size===15?" 🎉 All 15 completed!":"")}$("show").onclick=()=>{$("answer").classList.remove("hidden");$("show").classList.add("hidden")};$("back").onclick=render;$("reset").onclick=()=>{opened.clear();render()};render();</script></html>
