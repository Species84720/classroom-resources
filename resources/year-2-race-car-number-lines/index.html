<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7d6">
  <title>Race Car Number Lines | Year 2 Mathematics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="toolbar no-print" aria-label="Worksheet controls">
      <div>
        <p class="eyebrow">YEAR 2 • MATHEMATICS</p>
        <h1>🏎️ Race Car Number Lines 🏁</h1>
        <p>Fill the gaps and help the cars race to the finish!</p>
      </div>
      <div class="toolbar-actions">
        <button id="new-sheet" type="button">🎲 New race</button>
        <button id="print-sheet" type="button">🖨️ Print A4</button>
      </div>
    </section>

    <article class="worksheet" id="worksheet">
      <div class="hero-car" aria-hidden="true">
        <div class="speed-lines"><i></i><i></i><i></i></div>
        <div class="race-car-art">
          <div class="car-body"></div>
          <div class="car-cockpit"></div>
          <div class="car-number">2</div>
          <div class="wheel wheel-left"></div>
          <div class="wheel wheel-right"></div>
          <div class="rear-wing"></div>
        </div>
      </div>

      <header class="sheet-header">
        <div class="title-zone">
          <div class="flag-row" aria-hidden="true">🏁 ⭐ 🏎️ 💨 ⭐ 🏁</div>
          <h2>Number Line Race!</h2>
          <p>Write the missing numbers. Can every car reach the finish?</p>
        </div>
        <div class="name-box">
          <label>👤 Name <span></span></label>
          <label>📅 Date <span></span></label>
        </div>
      </header>

      <div class="track-banner" aria-hidden="true">
        <span class="car">🏎️</span>
        <span class="road"><i></i><i></i><i></i></span>
        <span class="flag">🏁</span>
      </div>

      <section id="lines" class="number-lines" aria-label="Number line questions"></section>

      <footer class="sheet-footer">
        <div class="trophy" aria-hidden="true">🏆</div>
        <p>Super racing! Check your numbers before you finish.</p>
        <div class="stars" aria-hidden="true">⭐ ⭐ ⭐</div>
      </footer>
    </article>
  </main>
  <script src="script.js"></script>
</body>
</html>
