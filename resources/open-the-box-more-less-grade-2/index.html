<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open the Box – Number Challenge</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#e6f6ff,#fff1cb);color:#26345b;text-align:center}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:clamp(2rem,5vw,3.8rem);color:#6536b4}p{font-size:1.15rem}.sets{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:25px auto}.sets button,.action{border:0;border-radius:15px;padding:15px 19px;background:#e6d8ff;color:#35216e;font-size:1.1rem;font-weight:800;cursor:pointer}.sets button[aria-pressed=true],.action{background:#6744c4;color:white}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:30px auto}.box{min-height:110px;border:5px solid white;border-radius:22px;background:linear-gradient(145deg,#ffc84b,#ed902b);box-shadow:0 7px #ba6c20;color:#fff;font-size:clamp(2rem,5vw,4rem);font-weight:900;cursor:pointer}.box:before{content:"🎁";display:block;font-size:1.4rem}.box.opened{background:linear-gradient(145deg,#50c8a7,#168e93);box-shadow:0 7px #116c71}.box.opened:before{content:"✓"}.panel{background:white;border-radius:28px;padding:35px 20px;margin:25px auto;max-width:800px;box-shadow:0 12px 35px #394d7430}.question{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;margin:30px auto;line-height:1.4}.answer{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:900;color:#087b53;margin:25px}.action{margin:8px}.secondary{background:#e7a02f;color:#282044}.hidden{display:none}.status{font-weight:bold}button:focus-visible{outline:4px solid #225de6;outline-offset:4px}@media(max-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}.box{min-height:95px}.sets button{flex:1 1 40%}}</style><main><h1>🎁 OPEN THE BOX! 🎁</h1><p>Grade 2 · 1 more, 1 less, 10 more and 10 less</p><p>Choose a number, solve the challenge, then reveal the answer!</p><nav class="sets" aria-label="Choose a group"><button data-set="0">1–5</button><button data-set="1">6–10</button><button data-set="2">11–13</button></nav><div id="home"><p class="status" id="status"></p><div class="grid" id="grid"></div></div><section class="panel hidden" id="panel" aria-live="polite"><h2 id="title"></h2><div class="question" id="question"></div><div class="answer hidden" id="answer"></div><button class="action" id="show">👀 Show answer</button><button class="action secondary" id="back">↩ Back to boxes</button></section><button class="action secondary" id="reset">🔄 Reset all boxes</button></main><script>const questions=[["1 more than 39","40"],["1 more than 59","60"],["1 more than 78","79"],["1 less than 78","77"],["1 less than 82","81"],["1 less than 60","59"],["1 less than 22","21"],["1 less than 100","99"],["10 more and 10 less: ________22________","12 and 32"],["10 more and 10 less: ________76________","66 and 86"],["10 more and 10 less: ________45________","35 and 55"],["10 more and 10 less: ________87________","77 and 97"],["10 more and 10 less: ________33________","23 and 43"]];let set=0;const opened=new Set();const $=id=>document.getElementById(id);function render(){document.querySelectorAll("[data-set]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.set)===set)));$("home").classList.remove("hidden");$("panel").classList.add("hidden");$("grid").replaceChildren();for(let i=set*5;i<Math.min(set*5+5,questions.length);i++){let b=document.createElement("button");b.className="box"+(opened.has(i)?" opened":"");b.textContent=i+1;b.setAttribute("aria-label","Open box "+(i+1));b.onclick=()=>{opened.add(i);$("home").classList.add("hidden");$("panel").classList.remove("hidden");$("title").textContent="🎁 Box "+(i+1);$("question").textContent=questions[i][0];$("answer").textContent="✅ "+questions[i][1];$("answer").classList.add("hidden");$("show").classList.remove("hidden")};$("grid").append(b)}$("status").textContent=opened.size+" of "+questions.length+" boxes opened"+(opened.size===questions.length?" 🎉 Brilliant!":"")}document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{set=Number(b.dataset.set);render()});$("show").onclick=()=>{$("answer").classList.remove("hidden");$("show").classList.add("hidden")};$("back").onclick=render;$("reset").onclick=()=>{opened.clear();render()};render();</script></html>
