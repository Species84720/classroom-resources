<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open the Box! Number Challenge</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#182c4c;background:#eaf7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#fff2ba,transparent 34%),radial-gradient(circle at 100% 60%,#d5f5e9,transparent 35%),#eaf7ff}.wrap{max-width:1050px;margin:auto;padding:24px 18px 50px}header{text-align:center}h1{font-size:clamp(2.2rem,6vw,4rem);margin:4px 0;color:#5634ac;text-shadow:2px 3px #fff}header p{font-size:1.1rem}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px auto}.tabs button,.action{border:0;border-radius:16px;padding:14px 20px;font:700 1rem inherit;font-weight:800;font-size:1rem;cursor:pointer;background:white;color:#382874;box-shadow:0 4px 0 #cfc4ef}.tabs button.active{color:white;background:#6745c9;box-shadow:0 4px 0 #3e268e}.status{text-align:center;font-size:1.1rem;font-weight:800;margin:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin:24px auto}.box{position:relative;aspect-ratio:1/1.06;background:linear-gradient(145deg,#ffc749,#ee8c21);border:5px solid white;border-radius:22px;color:#fff;font-weight:900;font-size:clamp(2.2rem,5vw,4.3rem);text-shadow:0 3px #a65820;box-shadow:0 8px 0 #bb641d,0 13px 18px #40618a29;cursor:pointer;transition:transform .15s}.box:hover{transform:translateY(-5px)}.box:focus-visible,button:focus-visible{outline:4px solid #2a6ff0;outline-offset:3px}.box::before{content:'🎁';font-size:clamp(1.2rem,2.5vw,2rem);position:absolute;top:8px;right:10px;text-shadow:none}.box.opened{background:linear-gradient(135deg,#46caa0,#168a92);box-shadow:0 8px 0 #136875,0 13px 18px #40618a29}.box.opened::before{content:'✓'}.note{text-align:center;color:#4d6480}.panel{background:white;border-radius:28px;box-shadow:0 14px 50px #24426025;padding:34px;max-width:760px;margin:16px auto;text-align:center}.panel h2{font-size:1.2rem;color:#6845b8}.question{font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:900;margin:32px auto;line-height:1.35}.answer{font-size:2rem;color:#117b5f;font-weight:900;margin:20px}.action{background:#6243c6;color:#fff;box-shadow:0 4px 0 #39228b;margin:7px}.action.secondary{background:#f6bd48;color:#30204e;box-shadow:0 4px 0 #c88220}.footer{text-align:center;margin-top:30px}.hidden{display:none!important}@media(max-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.box{font-size:2.8rem}.panel{padding:24px 16px}}</style></head>
<body><main class="wrap"><header><h1>🎁 OPEN THE BOX! 🎁</h1><p>Pick a numbered box, read the question, and say your answer!</p></header><nav class="tabs" aria-label="Question sets"><button data-set="0" class="active">⭐ Set 1 · Boxes 1–5</button><button data-set="1">🌈 Set 2 · Boxes 6–10</button><button data-set="2">🚀 Set 3 · Boxes 11–15</button></nav><div id="home"><div class="status" id="status"></div><div id="grid" class="grid"></div><p class="note">Each box hides one question. Answers appear only when you press “Show answer”.</p></div><section id="panel" class="panel hidden" aria-live="polite"><h2 id="boxTitle"></h2><div id="question" class="question"></div><div id="answer" class="answer hidden"></div><button id="show" class="action">👀 Show answer</button><button id="back" class="action secondary">↩ Back to boxes</button></section><div class="footer"><button id="reset" class="action secondary">🔄 Reset this set</button></div></main><script>
const questions=[
['Continue: 16, 17, 18, 19, _____','20'],
['Continue: 46, 47, 48, 49, _____','50'],
['17, _____, 19','18'],
['24, _____, 26','25'],
['What is the number after 54?','55'],
['What is the number after 67?','68'],
['What is the number after 20?','21'],
['What is the number after 29?','30'],
['What is the number before 55?','54'],
['What is the number before 10?','9'],
['What is the number before 16?','15'],
['10 is bigger than 11. True or false?','False'],
['The number after 20 is 30. True or false?','False — it is 21'],
['What is the number between 8 and 10?','9'],
['What is the number between 18 and 20?','19']
];let set=0,current=null;const opened=new Set();const $=id=>document.getElementById(id);
function render(){document.querySelectorAll('[data-set]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.set)===set);b.setAttribute('aria-pressed',String(Number(b.dataset.set)===set))});$('home').classList.remove('hidden');$('panel').classList.add('hidden');$('grid').replaceChildren();let count=0;for(let i=set*5;i<set*5+5;i++){const b=document.createElement('button');b.className='box'+(opened.has(i)?' opened':'');b.textContent=i+1;b.setAttribute('aria-label','Open box '+(i+1));b.onclick=()=>openBox(i);$('grid').append(b);if(opened.has(i))count++}$('status').textContent='Set '+(set+1)+' • '+count+' of 5 boxes opened'+(count===5?' 🎉 Amazing!':'');}
function openBox(i){current=i;opened.add(i);$('home').classList.add('hidden');$('panel').classList.remove('hidden');$('boxTitle').textContent='🎁 BOX '+(i+1);$('question').textContent=questions[i][0];$('answer').textContent='✅ '+questions[i][1];$('answer').classList.add('hidden');$('show').classList.remove('hidden')}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{set=Number(b.dataset.set);render()});$('show').onclick=()=>{$('answer').classList.remove('hidden');$('show').classList.add('hidden')};$('back').onclick=render;$('reset').onclick=()=>{for(let i=set*5;i<set*5+5;i++)opened.delete(i);render()};render();
</script></body></html>
