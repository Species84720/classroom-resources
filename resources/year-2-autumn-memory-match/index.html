const board=document.querySelector('#board'),status=document.querySelector('#status'),stats=document.querySelector('#stats'),choices=document.querySelector('#choices'),apply=document.querySelector('#apply');
let active=pictures.slice(0,4),first=null,locked=false,moves=0,matches=0,pending=null;
for(const [i,p] of pictures.entries()){const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='checkbox';input.value=i;input.checked=i<4;input.setAttribute('aria-label','Include '+p.name);const img=document.createElement('img');img.src=p.src;img.alt='';const text=document.createElement('span');text.textContent=p.name;label.append(img,text,input);choices.append(label);input.addEventListener('change',updateSelection)}
function selected(){return [...choices.querySelectorAll('input:checked')].map(e=>pictures[Number(e.value)])}
function updateSelection(){const n=selected().length;apply.disabled=n<2;document.querySelector('#selection-note').textContent=n<2?'Choose at least 2 pictures.':`${n} pairs · ${n*2} cards. Start to apply your choice.`}
document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{choices.querySelectorAll('input').forEach((c,i)=>c.checked=i<Number(b.dataset.count));updateSelection()}));
apply.addEventListener('click',()=>{if(selected().length<2)return;active=selected();document.querySelector('#settings').open=false;start()});document.querySelector('#restart').addEventListener('click',start);
function updateStats(){stats.textContent=`Pairs: ${matches} / ${active.length} · Turns: ${moves}`}
function start(){clearTimeout(pending);pending=null;first=null;locked=false;moves=matches=0;const deck=active.flatMap(p=>[p,p]);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}board.replaceChildren();board.classList.toggle('large',active.length>5);deck.forEach((p,i)=>{const b=document.createElement('button');b.className='card';b.dataset.picture=p.name;b.dataset.position=i+1;b.setAttribute('aria-label',`Card ${i+1}, face down`);const back=document.createElement('span');back.className='back';back.textContent='?';back.setAttribute('aria-hidden','true');const img=document.createElement('img');img.src=p.src;img.alt='';b.append(back,img);b.addEventListener('click',()=>flip(b));board.append(b)});updateStats();status.textContent='Choose two cards.'}
function hide(b){b.classList.remove('revealed');b.setAttribute('aria-label',`Card ${b.dataset.position}, face down`)}
function flip(b){if(locked||b===first||b.classList.contains('matched'))return;b.classList.add('revealed');b.setAttribute('aria-label',`Card ${b.dataset.position}: ${b.dataset.picture}`);if(!first){first=b;status.textContent='Choose one more card.';return}moves++;const a=first;first=null;updateStats();if(a.dataset.picture===b.dataset.picture){matches++;[a,b].forEach(c=>{c.classList.add('matched');c.disabled=true;c.setAttribute('aria-label',`${c.dataset.picture}, matched`)});updateStats();status.textContent=matches===active.length?`Well done! You found all ${matches} pairs in ${moves} turns. Play a new round!`:'A matching pair! Choose two more cards.'}else{locked=true;status.textContent='Try again. Remember these pictures!';pending=setTimeout(()=>{hide(a);hide(b);locked=false;pending=null;status.textContent='Choose two cards.'},1400)}}
updateSelection();start();
