<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open the Box – Odd and Even</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#e6f6ff,#fff1cb);color:#26345b;text-align:center}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:clamp(2rem,5vw,3.8rem);color:#6536b4}p{font-size:1.15rem}.sets{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:25px auto}.sets button,.action{border:0;border-radius:15px;padding:15px 19px;background:#e6d8ff;color:#35216e;font-size:1.1rem;font-weight:800;cursor:pointer}.sets button[aria-pressed=true],.action{background:#6744c4;color:white}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:30px auto}.box{min-height:110px;border:5px solid white;border-radius:22px;background:linear-gradient(145deg,#ffc84b,#ed902b);box-shadow:0 7px #ba6c20;color:#452711;font-size:clamp(2rem,5vw,4rem);font-weight:900;cursor:pointer}.box:before{content:"🎁";display:block;font-size:1.4rem}.box.opened{color:#153c35;background:linear-gradient(145deg,#50c8a7,#168e93);box-shadow:0 7px #116c71}.box.opened:before{content:"✓"}.panel{background:white;border-radius:28px;padding:35px 20px;margin:25px auto;max-width:800px;box-shadow:0 12px 35px #394d7430}.question{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;margin:30px auto;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.answer{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:900;color:#087b53;margin:25px}.action{margin:8px}.secondary{background:#e7a02f;color:#282044}.hidden{display:none}.status{font-weight:bold}button:focus-visible{outline:4px solid #225de6;outline-offset:4px}@media(max-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}.box{min-height:95px}.sets button{flex:1 1 40%}}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.choice{border:2px solid #6744c4;background:#f1eaff;color:#35216e;border-radius:16px;padding:16px 25px;font:inherit;font-size:clamp(1.5rem,4vw,2rem);font-weight:bold;min-height:60px;cursor:pointer}.choice:disabled{opacity:1}.choice.correct{background:#d4f4e5;border-color:#087b53}#feedback{font-weight:bold;min-height:1.5em}</style><main><a href="../../">← Classroom resources</a><h1>🎁 OPEN THE BOX! 🎁</h1><p>Year 2 · Odd and even numbers</p><p>Choose a box, then tap your answer!</p><nav class="sets" aria-label="Choose a group"><button data-set="0">1–5</button><button data-set="1">6–10</button><button data-set="2">11–15</button></nav><div id="home"><p class="status" id="status" role="status"></p><div class="grid" id="grid"></div></div><section class="panel hidden" id="panel" aria-live="polite"><h2 id="title"></h2><div class="question" id="question"></div><div id="choices" class="choices" aria-label="Answer choices"></div><p id="feedback" role="status"></p><div class="answer hidden" id="answer"></div><button class="action" id="show">👀 Show answer</button><button class="action secondary" id="back">↩ Back to boxes</button></section><button class="action secondary" id="reset">🔄 Reset all boxes</button></main><script>const questions=[["Is 6 odd or even?", "Even"], ["Is 9 odd or even?", "Odd"], ["Is 1 odd or even?", "Odd"], ["Is 2 odd or even?", "Even"], ["Is 4 odd or even?", "Even"], ["Is 15 odd or even?", "Odd"], ["Is 63 odd or even?", "Odd"], ["Is 60 odd or even?", "Even"], ["Is 72 odd or even?", "Even"], ["Is 48 odd or even?", "Even"], ["Is 22 odd or even?", "Even"], ["next even number 24:\n25, 27, 26", "26"], ["next odd number 47:\n48, 49, 50", "49"], ["next even number 60:\n61, 62, 63", "62"], ["next odd number 51:\n53, 52, 54", "53"]];let set=0;let current=0;const opened=new Set();const $=id=>document.getElementById(id);function showQuestion(i){
 const [prompt,answer]=questions[i];
 const options=i<11?["Odd","Even"]:prompt.split("\n")[1].split(", ");
 $("question").textContent=i<11?prompt.replace(/ odd or even\?$/, ""):prompt.split("\n")[0];
 $("feedback").textContent="";$("choices").replaceChildren();
 options.forEach(option=>{const b=document.createElement("button");b.className="choice";b.textContent=option;b.onclick=()=>{
 if(option!==answer){$("feedback").textContent="Try again!";return}
 $("feedback").textContent="✓ Correct! Well done!";b.classList.add("correct");
 for(const choice of $("choices").children)choice.disabled=true;
 $("show").classList.add("hidden");$("back").focus();
 };$("choices").append(b)});
}
function render(){document.querySelectorAll("[data-set]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.set)===set)));$("home").classList.remove("hidden");$("panel").classList.add("hidden");$("grid").replaceChildren();for(let i=set*5;i<Math.min(set*5+5,questions.length);i++){let b=document.createElement("button");b.className="box"+(opened.has(i)?" opened":"");b.textContent=i+1;b.setAttribute("aria-label","Open box "+(i+1)+(opened.has(i)?", already opened":""));b.onclick=()=>{current=i;opened.add(i);$("home").classList.add("hidden");$("panel").classList.remove("hidden");$("title").textContent="🎁 Box "+(i+1);showQuestion(i);$("answer").textContent="✅ "+questions[i][1];$("answer").classList.add("hidden");$("show").classList.remove("hidden");$("choices").children[0].focus()};$("grid").append(b)}$("status").textContent=opened.size+" of "+questions.length+" boxes opened"+(opened.size===questions.length?" 🎉 Brilliant!":"")}document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{set=Number(b.dataset.set);render()});$("show").onclick=()=>{$("answer").classList.remove("hidden");$("show").classList.add("hidden");$("back").focus()};$("back").onclick=()=>{render();$("grid").children[current-set*5].focus()};$("reset").onclick=()=>{opened.clear();render()};render();</script></html>
