<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <title>Number Memory Match | Year 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <span class="eyebrow">Year 2 Maths</span>
      <h1>Number Memory Match</h1>
      <p>Turn over two cards. Can you find every matching number?</p>
    </header>

    <section class="teacher-panel" aria-labelledby="setup-title">
      <div>
        <p class="panel-label">Teacher setup</p>
        <h2 id="setup-title">Choose the numbers</h2>
      </div>
      <form id="setup-form">
        <label>From <input id="min-number" type="number" value="1" step="1" required></label>
        <label>To <input id="max-number" type="number" value="10" step="1" required></label>
        <label>Pairs
          <select id="pair-count">
            <option value="4">4 pairs</option>
            <option value="6" selected>6 pairs</option>
            <option value="8">8 pairs</option>
            <option value="10">10 pairs</option>
            <option value="12">12 pairs</option>
          </select>
        </label>
        <button class="primary" type="submit">Make game</button>
      </form>
      <p id="setup-error" class="error" role="alert"></p>
    </section>

    <section class="game-shell" aria-labelledby="game-title">
      <div class="game-bar">
        <div>
          <p class="panel-label">Playing with <strong id="range-label">1–10</strong></p>
          <h2 id="game-title">Find the pairs</h2>
        </div>
        <div class="stats" aria-live="polite">
          <span><strong id="matches">0</strong> matches</span>
          <span><strong id="turns">0</strong> turns</span>
        </div>
        <button id="new-round" class="secondary" type="button">Shuffle</button>
      </div>

      <p id="message" class="message" aria-live="polite">Choose two cards.</p>
      <div id="board" class="board" aria-label="Number memory cards"></div>
    </section>
  </main>

  <div id="celebration" class="celebration" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="celebration-card">
      <div class="stars" aria-hidden="true">★ ✦ ★</div>
      <h2 id="win-title">Brilliant matching!</h2>
      <p id="win-summary"></p>
      <button id="play-again" class="primary" type="button">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
