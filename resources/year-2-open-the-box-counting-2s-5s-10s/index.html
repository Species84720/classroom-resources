<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open the Box – Counting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;text-align:center;background:linear-gradient(125deg,#e4f8ff,#fff1cb,#f0e7ff);color:#243258}main{max-width:1100px;margin:auto;padding:20px}h1{color:#6337b2;font-size:clamp(2rem,6vw,4rem)}p{font-size:1.15rem}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px}.tabs button,.action{border:0;border-radius:15px;padding:15px 20px;min-height:48px;font-size:1rem;font-weight:800;cursor:pointer;background:#fff;color:#5335a1}.tabs button[aria-pressed=true],.action{background:#6542c2;color:white}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:17px;margin:25px 0}.gift{aspect-ratio:1;min-height:95px;border:5px solid white;border-radius:22px;background:linear-gradient(145deg,#ffd35c,#ed8a25);box-shadow:0 7px #b9631c;color:white;font-size:clamp(2rem,5vw,4rem);font-weight:900;cursor:pointer}.gift:before{content:"🎁";display:block;font-size:1.5rem}.gift.opened{background:linear-gradient(145deg,#61d6b3,#148f92);box-shadow:0 7px #13747a}.gift.opened:before{content:"✓"}.panel{background:white;max-width:800px;border-radius:28px;padding:35px 20px;margin:28px auto;box-shadow:0 12px 32px #22335525}.prompt{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;margin:30px auto;overflow-wrap:anywhere}.instruction{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:900;color:#5734ad;margin:18px auto 8px}.sequence{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.18em;font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:900;margin:28px auto}.sequence .missing{color:#087c4d;min-width:1.2em}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px auto}.choice{min-width:100px;min-height:65px;padding:12px 22px;border:3px solid #6743ba;border-radius:16px;background:#f2edff;color:#3b287a;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;cursor:pointer}.choice.correct{background:#d4f7e7;border-color:#087c4d;color:#086b43}.choice.wrong{background:#ffe2e2;border-color:#c13434;color:#8d1b1b}.feedback{font-size:1.4rem;font-weight:800;min-height:1.7em}.answer{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:900;color:#08754f;margin:24px}.secondary{background:#ffd05a;color:#382858}.hidden{display:none!important}button:focus-visible{outline:4px solid #155ce0;outline-offset:4px}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}.panel{padding:24px 12px}}</style><main><h1>🎁 OPEN THE BOX! 🎁</h1><p>Year 2 • Count in 2s, 5s and 10s</p><p>Choose a box, say the missing numbers, then reveal the answer!</p><nav class="tabs" aria-label="Question sets"><button data-set="0">⭐ Boxes 1–5</button><button data-set="1">🌈 Boxes 6–10</button><button data-set="2">🚀 Boxes 11–15</button></nav><div id="home"><p id="status" aria-live="polite"></p><div id="grid" class="grid"></div></div><section id="panel" class="panel hidden" aria-live="polite"><h2 id="title"></h2><div id="instruction" class="instruction"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices hidden"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="answer" class="answer hidden"></div><button id="show" class="action">👀 Show answer</button><button id="back" class="action secondary">↩ Back to boxes</button></section><button id="reset" class="action secondary">🔄 Reset game</button></main><script>const q=[["2s","2, __, 6, __, 10","2, 4, 6, 8, 10"],["2s","3, __, 7, __, 11","3, 5, 7, 9, 11"],["2s","12, __, 16, __, 20","12, 14, 16, 18, 20"],["2s","23, __, 27, __, 31","23, 25, 27, 29, 31"],["2s","28, __, 32, __, 36","28, 30, 32, 34, 36"],["5s","2, __, 12, __, 22","2, 7, 12, 17, 22"],["5s","__, 10, __, 20","5, 10, 15, 20"],["5s","25, __, 35, __, 45","25, 30, 35, 40, 45"],["5s","23, __, 33","23, 28, 33"],["2s","48, __, __, __, __, 58","48, 50, 52, 54, 56, 58"],["10s","__, 10, __, 30","0, 10, 20, 30"],["10s","25, __, 45, __, 65","25, 35, 45, 55, 65"],["10 more than 75","76, 85, 65","85"],["10 more than 3","4, 13, 24","13"],["10 less than 74","84, 70, 64","64"]],opened=new Set(),el=id=>document.getElementById(id);let set=0;function render(){document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.set)===set)));el('home').classList.remove('hidden');el('panel').classList.add('hidden');el('grid').replaceChildren();let n=0;for(let i=set*5;i<set*5+5;i++){const b=document.createElement('button');b.className='gift'+(opened.has(i)?' opened':'');b.textContent=i+1;b.setAttribute('aria-label','Open box '+(i+1));b.onclick=()=>open(i);el('grid').append(b);if(opened.has(i))n++}el('status').textContent=n+' of 5 boxes opened in this set • '+opened.size+' of 15 overall'+(opened.size===15?' 🎉 Well done!':'')}function open(i){opened.add(i);el('home').classList.add('hidden');el('panel').classList.remove('hidden');el('title').textContent='🎁 Box '+(i+1);el('instruction').textContent=i<12?'Count in '+q[i][0]:q[i][0];el('prompt').replaceChildren();el('choices').replaceChildren();el('feedback').textContent='';el('answer').classList.add('hidden');el('show').classList.toggle('hidden',i>=12);el('choices').classList.toggle('hidden',i<12);if(i<12){const original=q[i][1].split(',').map(x=>x.trim()),full=q[i][2].split(',').map(x=>x.trim());const line=document.createElement('div');line.className='sequence';original.forEach((v,j)=>{const part=document.createElement('span');part.className=v==='__'?'missing':'';part.textContent=v==='__'?'_____':v;part.dataset.value=full[j];part.dataset.missing=String(v==='__');line.append(part);if(j<original.length-1){const comma=document.createElement('span');comma.textContent=',';line.append(comma)}});el('prompt').append(line);el('show').focus()}else{el('prompt').classList.add('hidden');const correct=q[i][2];q[i][1].split(',').map(x=>x.trim()).forEach(value=>{const b=document.createElement('button');b.className='choice';b.textContent=value;b.onclick=()=>{if(value===correct){b.classList.add('correct');el('feedback').textContent='✅ Correct! Well done!';el('feedback').style.color='#087c4d';el('choices').querySelectorAll('button').forEach(x=>x.disabled=true)}else{b.classList.add('wrong');el('feedback').textContent='Try again!';el('feedback').style.color='#a52b2b';b.disabled=true}};el('choices').append(b)});el('choices').querySelector('button').focus()}if(i<12)el('prompt').classList.remove('hidden')}
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{set=Number(b.dataset.set);render()});el('show').onclick=()=>{el('prompt').querySelectorAll('[data-missing="true"]').forEach(x=>x.textContent=x.dataset.value);el('show').classList.add('hidden');el('back').focus()};el('back').onclick=render;el('reset').onclick=()=>{opened.clear();set=0;render()};render();</script></html>
