<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Cards 1–100</title>
  <style>
    :root { color-scheme: light; font-family: "Trebuchet MS", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #252225; background: #eef5f5; }
    .toolbar {
      position: sticky; top: 0; z-index: 10; display: flex; gap: 1rem;
      align-items: center; justify-content: space-between; padding: .8rem 1.25rem;
      background: #16324f; color: white; box-shadow: 0 2px 10px #0003;
    }
    .toolbar h1 { margin: 0; font-size: clamp(1rem, 2.4vw, 1.5rem); }
    button { border: 0; border-radius: .6rem; padding: .65rem 1rem; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible, .download:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
    .download { display: inline-block; border-radius: .6rem; padding: .65rem 1rem; background: #fff; color: #16324f; text-decoration: none; font-weight: 700; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 1.25rem; padding: 1.25rem; }
    .card {
      --accent: #00aa56; min-height: 620px; padding: 1rem 1.2rem 1.35rem;
      display: grid; grid-template-rows: auto auto 1fr; justify-items: center;
      align-items: start; background: #fff; border: 8px solid var(--accent);
      border-radius: 2.7rem; break-inside: avoid; page-break-inside: avoid;
    }
    .number {
      display: grid; place-items: center; width: 11rem; aspect-ratio: 1;
      margin: 1rem 0 .8rem; border-radius: 50%; color: #fff;
      background: var(--accent); font-size: 6rem; font-weight: 800; line-height: 1;
    }
    .word { margin: 0 0 1.1rem; font-family: Georgia, serif; font-size: clamp(1.8rem, 4vw, 3rem); font-style: italic; text-align: center; }
    .blocks {
      display: flex; flex-wrap: wrap; gap: .45rem; width: 100%;
      align-content: flex-start; align-items: flex-start; justify-content: center;
    }
    .tens, .ones { display: flex; justify-content: center; gap: .12rem; }
    /* Never wrap tens: if the ones don't fit, only the ones move below. */
    .tens { flex: 0 0 auto; flex-wrap: nowrap; align-items: flex-start; }
    .ones { flex: 0 0 auto; flex-wrap: wrap; width: calc(var(--block-size) * 3 + .24rem); align-content: flex-start; align-items: flex-start; }
    .tower { display: grid; grid-template-rows: repeat(10, 1fr); width: var(--block-size); }
    .cube {
      width: var(--block-size); aspect-ratio: 1; border: 1px solid #ffffffcc;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent), white 22%), var(--accent));
      box-shadow: inset -.15rem -.15rem 0 #0001, inset .12rem .12rem 0 #fff4;
    }
    .tower .cube:first-child { border-radius: .2rem .2rem 0 0; }
    .tower .cube:last-child { border-radius: 0 0 .2rem .2rem; }
    .loose-cube { border-radius: .2rem; box-shadow: inset -.2rem -.2rem 0 #0002, inset .15rem .15rem 0 #fff5, .12rem .15rem .2rem #0002; }
    @media print {
      @page { size: A4 portrait; margin: 6mm; }
      html, body { margin: 0; padding: 0; background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar { display: none; }
      /* A4 portrait printable area: 198mm × 285mm. Four cards per sheet. */
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, 139.5mm);
        gap: 6mm;
        padding: 0;
        width: 100%;
      }
      .card {
        width: 100%; height: 139.5mm; min-height: 0; min-width: 0;
        border-width: 2mm; border-radius: 7mm; padding: 2mm 4mm;
        grid-template-rows: auto auto minmax(0, 1fr);
        break-inside: avoid; page-break-inside: avoid;
      }
      .number { width: 25mm; margin: 1mm 0; font-size: 15mm; }
      .word { margin: 0 0 2mm; font-size: 7mm; }
      .blocks { gap: 2mm; align-content: flex-start; }
      /* Start a fresh sheet after each group of four cards. */
      .card:nth-child(4n + 1) { break-before: page; page-break-before: always; }
      .card:first-child { break-before: auto; page-break-before: auto; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>Number Cards 1–100</h1>
    <a class="download" href="./number-cards-1-to-100.pdf" download="number-cards-1-to-100.pdf">Download PDF</a>
  </header>
  <main class="cards" id="cards" aria-label="Number cards from 1 to 100"></main>
  <script>
    const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
    const teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const colours = ['#00aa56', '#24b7bd', '#e84a5f', '#7a5cc7', '#ef8b2c', '#1677c8'];

    function numberWord(number) {
      if (number === 100) return 'one hundred';
      if (number < 10) return ones[number];
      if (number < 20) return teens[number - 10];
      const unit = number % 10;
      return `${tens[Math.floor(number / 10)]}${unit ? `-${ones[unit]}` : ''}`;
    }

    function makeCard(number) {
      const card = document.createElement('article');
      const word = numberWord(number);
      card.className = 'card';
      card.style.setProperty('--accent', colours[(number - 1) % colours.length]);
      const tenCount = Math.floor(number / 10);
      const oneCount = number % 10;
      card.style.setProperty('--block-size', tenCount >= 7 ? '1.2rem' : tenCount >= 5 ? '1.45rem' : tenCount >= 3 ? '1.7rem' : '2rem');
      card.setAttribute('aria-label', `${number}, ${word}: ${tenCount} tens and ${oneCount} ones`);

      const numeral = document.createElement('div');
      numeral.className = 'number';
      numeral.textContent = number;
      numeral.setAttribute('aria-hidden', 'true');

      const name = document.createElement('p');
      name.className = 'word';
      name.textContent = word;
      name.setAttribute('aria-hidden', 'true');

      const blocks = document.createElement('div');
      blocks.className = 'blocks';
      blocks.setAttribute('aria-hidden', 'true');

      const tensGroup = document.createElement('div');
      tensGroup.className = 'tens';
      for (let ten = 0; ten < tenCount; ten += 1) {
        const tower = document.createElement('div');
        tower.className = 'tower';
        for (let unit = 0; unit < 10; unit += 1) {
          const cube = document.createElement('span');
          cube.className = 'cube';
          tower.append(cube);
        }
        tensGroup.append(tower);
      }

      const onesGroup = document.createElement('div');
      onesGroup.className = 'ones';
      for (let one = 0; one < oneCount; one += 1) {
        const cube = document.createElement('span');
        cube.className = 'cube loose-cube';
        onesGroup.append(cube);
      }

      if (tenCount) blocks.append(tensGroup);
      if (oneCount) blocks.append(onesGroup);
      card.append(numeral, name, blocks);
      return card;
    }

    const cards = document.getElementById('cards');
    const fragment = document.createDocumentFragment();
    for (let number = 1; number <= 100; number += 1) fragment.append(makeCard(number));
    cards.append(fragment);

  </script>
</body>
</html>
