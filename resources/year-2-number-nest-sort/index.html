<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7ecd3">
  <title>Number Nest Sort | Year 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <div><p class="eyebrow">Year 2 · Numbers to 30</p><h1>Number Nest Sort</h1>
        <p class="instruction">Drag each egg to the nest with the matching number range.</p></div>
      <button id="newRound" class="pill" type="button">↻ New round</button>
    </header>
    <section class="status" aria-label="Game progress">
      <p id="progress"><strong>0</strong> of 12 eggs sorted</p>
      <div class="meter" aria-hidden="true"><span id="meterFill"></span></div>
      <p id="feedback" role="status" aria-live="polite">Choose an egg to begin.</p>
    </section>
    <section class="nests" aria-label="Number range nests">
      <button class="nest" type="button" data-min="1" data-max="10" aria-label="Nest for numbers 1 to 10"><span class="label">1–10</span><span class="twigs" aria-hidden="true"></span><span class="nest-eggs" aria-hidden="true"></span></button>
      <button class="nest" type="button" data-min="11" data-max="20" aria-label="Nest for numbers 11 to 20"><span class="label">11–20</span><span class="twigs" aria-hidden="true"></span><span class="nest-eggs" aria-hidden="true"></span></button>
      <button class="nest" type="button" data-min="21" data-max="30" aria-label="Nest for numbers 21 to 30"><span class="label">21–30</span><span class="twigs" aria-hidden="true"></span><span class="nest-eggs" aria-hidden="true"></span></button>
    </section>
    <section class="egg-area" aria-labelledby="eggHeading">
      <div class="tray-heading"><h2 id="eggHeading">Egg basket</h2><p>Or tap an egg, then tap a nest.</p></div>
      <div id="eggTray" class="egg-tray"></div>
    </section>
    <div id="celebration" class="celebration" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="wellDone"><span class="chick" aria-hidden="true">🐣</span><h2 id="wellDone">Brilliant sorting!</h2><p>Every egg is safe in the right nest.</p><button id="playAgain" class="pill" type="button">Play another round</button></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
