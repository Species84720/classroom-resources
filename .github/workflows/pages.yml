name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - name: Install PDF generator
        run: python -m pip install reportlab
      - name: Generate downloadable flashcards PDF
        run: python scripts/generate-number-cards-pdf.py
      - name: Publish PDF into repository site source
        run: |
          cp _site/resources/year-2-number-cards-1-to-100/number-cards-1-to-100.pdf resources/year-2-number-cards-1-to-100/number-cards-1-to-100.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/year-2-number-cards-1-to-100/number-cards-1-to-100.pdf
          git diff --cached --quiet || git commit -m "Update generated number cards PDF [skip ci]"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
