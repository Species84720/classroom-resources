<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Egg Number Hunt • 91–100</title>
<style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#49305c;background:#fff5dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#fff 0,transparent 28%),linear-gradient(#e7d7ff,#fff6d8 60%);text-align:center}main{max-width:1050px;margin:auto;padding:22px 14px 50px}h1{font-size:clamp(2rem,6vw,3.8rem);margin:8px 0}p{font-size:clamp(1.1rem,2.8vw,1.5rem)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #6d40ce;outline-offset:4px}.primary{background:#7a45c8;color:white;border:0;border-radius:22px;padding:15px 25px;font-weight:900;font-size:1.25rem;box-shadow:0 6px #51259b}.primary:active{transform:translateY(4px);box-shadow:0 2px #51259b}.box{font-size:clamp(8rem,25vw,14rem);background:none;border:0;filter:drop-shadow(0 12px 7px #b99e78);transition:transform .25s}.box:hover{transform:scale(1.07)}.panel{background:#ffffffb8;border:3px solid #fff;border-radius:28px;padding:20px;margin:20px auto;box-shadow:0 8px 25px #8056a21a}.eggs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:25px 0}.egg{position:relative;border:3px solid #d39a26;background:linear-gradient(115deg,#fff5aa 10%,#ffce38 42%,#e9a81c 76%,#fff1a0);width:115px;height:145px;border-radius:53% 53% 47% 47% / 63% 63% 37% 37%;box-shadow:inset -9px -7px 0 #cc8b1c55,0 7px 0 #c78a2366;display:grid;place-items:center;font-size:2rem;font-weight:1000;color:#56321d;transition:transform .2s}.egg:hover:not(:disabled){transform:translateY(-6px) rotate(-3deg)}.egg:disabled{cursor:default}.egg.revealed{background:linear-gradient(120deg,#fff4c6,#ffe99d);border-style:dashed;animation:pop .35s}.egg .sparkle{position:absolute;top:12px;left:20px;font-size:1.4rem}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:22px auto}.slot{min-height:125px;border:3px dashed #b08cd9;background:#fff8e9;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}.slot strong{font-size:1.1rem}.slot button{border:0;border-radius:15px;background:#ffdd68;color:#54311c;padding:10px;font-size:1.5rem;font-weight:900;width:100%;min-height:64px}.slot.correct{border-color:#4fba72;background:#eaffdf}.slot.correct button{background:#ffe084}.slot.wrong{border-color:#e87b80}.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:90px}.tray button{border:2px solid #d89c24;border-radius:45%;background:linear-gradient(120deg,#fff5aa,#f6b927);font-size:1.6rem;font-weight:900;color:#50351d;min-width:78px;min-height:86px}.tray button.selected{outline:5px solid #8651db;transform:translateY(-6px)}.progress{font-weight:800;color:#663d9e}.hidden{display:none!important}.message{font-size:1.35rem;font-weight:900;min-height:2em;color:#663d9e}.confetti{font-size:3rem;animation:pop .7s infinite alternate}@keyframes pop{from{transform:scale(.85)}to{transform:scale(1.08)}}@media(max-width:560px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.egg{width:91px;height:118px;font-size:1.7rem}.slot{min-height:110px}}
</style>
</head>
<body><main>
<h1>✨ Golden Egg Number Hunt! ✨</h1>
<p id="instructions">Tap the treasure box to find the golden eggs!</p>
<section id="start" class="panel"><button id="openBox" class="box" aria-label="Open treasure box">🎁</button><p>What's hiding inside?</p></section>
<section id="hunt" class="panel hidden"><div class="progress" id="progress" aria-live="polite"></div><div id="eggs" class="eggs"></div><div class="message" id="huntMessage" aria-live="polite"></div><button id="arrange" class="primary hidden">Let's put them in order! ➜</button></section>
<section id="ordering" class="panel hidden"><p>Choose a golden egg, then tap the next empty space. Start with 91!</p><div id="slots" class="slots"></div><h2>Golden eggs to place</h2><div id="tray" class="tray"></div><div class="message" id="orderMessage" aria-live="polite"></div><button id="resetOrder" class="primary">Mix the eggs again 🔀</button></section>
<section id="finish" class="panel hidden"><div class="confetti">🎉 🥚 🌟 🎉</div><h2>Wonderful counting!</h2><p>You put every egg in order from 91 to 100!</p><div id="countNumbers" class="eggs"></div><button id="countTogether" class="primary">🔊 Count together!</button> <button id="again" class="primary">Play again ↻</button><p id="speaking" aria-live="polite"></p></section>
</main>
<script>
const $=id=>document.getElementById(id);
const numbers=Array.from({length:10},(_,i)=>91+i);
let discovered=new Set(), placed=[], selected=null, remaining=[], speechToken=0;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){for(const s of ['start','hunt','ordering','finish'])$(s).classList.toggle('hidden',s!==id)}
function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(text));u.rate=.75;u.lang='en-US';window.speechSynthesis.speak(u)}
function begin(){discovered.clear();placed=[];selected=null;show('hunt');$('instructions').textContent='Tap each golden egg to discover its number!';$('arrange').classList.add('hidden');$('huntMessage').textContent='Find all ten eggs!';let root=$('eggs');root.replaceChildren();shuffle(numbers).forEach(n=>{let b=document.createElement('button');b.className='egg';b.setAttribute('aria-label','Open a golden egg');b.innerHTML='<span class="sparkle">✨</span>🥚';b.onclick=()=>{if(discovered.has(n))return;discovered.add(n);b.textContent=n;b.classList.add('revealed');b.disabled=true;b.setAttribute('aria-label','Golden egg number '+n);speak(n);$('progress').textContent=discovered.size+' of 10 eggs opened';$('huntMessage').textContent=discovered.size===10?'Hooray! You found every egg! 🎉':'Great! Keep opening eggs!';if(discovered.size===10)$('arrange').classList.remove('hidden')};root.append(b)});$('progress').textContent='0 of 10 eggs opened'}
function ordering(){show('ordering');$('instructions').textContent='Put the golden eggs in number order!';placed=[];selected=null;remaining=shuffle(numbers);render()}
function render(){let slots=$('slots');slots.replaceChildren();numbers.forEach((n,i)=>{let box=document.createElement('div');box.className='slot'+(placed[i]===n?' correct':'');let label=document.createElement('strong');label.textContent='Place '+(i+1);box.append(label);if(placed[i]!==undefined){let b=document.createElement('button');b.textContent=placed[i];b.setAttribute('aria-label','Remove egg '+placed[i]);b.onclick=()=>{remaining.push(placed[i]);placed.splice(i,1);selected=null;render()};box.append(b)}else{let b=document.createElement('button');b.textContent='?';b.setAttribute('aria-label','Place selected egg in position '+(i+1));b.onclick=()=>place(i);box.append(b)}slots.append(box)});let tray=$('tray');tray.replaceChildren();remaining.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=selected===n?'selected':'';b.setAttribute('aria-pressed',selected===n?'true':'false');b.onclick=()=>{selected=n;render();$('orderMessage').textContent='Now tap the next empty space!'};tray.append(b)})}
function place(i){if(selected===null){$('orderMessage').textContent='Choose an egg first!';return}if(i!==placed.length){$('orderMessage').textContent='Start at the first empty space!';return}if(selected!==numbers[i]){$('orderMessage').textContent='Try again! Look for '+numbers[i]+' next.';speak('Try '+numbers[i]);return}placed.push(selected);remaining=remaining.filter(n=>n!==selected);speak(selected);selected=null;if(placed.length===10){complete();return}$('orderMessage').textContent='Amazing! Now find '+numbers[placed.length]+'.';render()}
function complete(){show('finish');$('instructions').textContent='You did it! Count from 91 to 100 together!';let root=$('countNumbers');root.replaceChildren();numbers.forEach(n=>{let el=document.createElement('button');el.className='egg revealed';el.textContent=n;el.onclick=()=>speak(n);root.append(el)});$('speaking').textContent='Tap an egg to hear its number, or count together!'}
function countTogether(){if(!('speechSynthesis' in window)){$('speaking').textContent='91, 92, 93, 94, 95, 96, 97, 98, 99, 100!';return}speechToken++;window.speechSynthesis.cancel();let token=speechToken;let i=0;function next(){if(token!==speechToken||i>=numbers.length){if(i>=numbers.length)$('speaking').textContent='🎉 Great counting!';return}let n=numbers[i++];$('speaking').textContent='Counting together: '+n;let u=new SpeechSynthesisUtterance(String(n));u.rate=.7;u.lang='en-US';u.onend=next;u.onerror=next;window.speechSynthesis.speak(u)}next()}
$('openBox').onclick=begin;$('arrange').onclick=ordering;$('resetOrder').onclick=ordering;$('again').onclick=()=>{speechToken++;window.speechSynthesis?.cancel();show('start');$('instructions').textContent='Tap the treasure box to find the golden eggs!'};$('countTogether').onclick=countTogether;
</script></body></html>
